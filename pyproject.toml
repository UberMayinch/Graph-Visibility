[project]
name = "graph-visibility"
version = "0.1.0"
description = "Chaotic Systems Visibility Graph Analysis"
authors = [
    {name = "Research Team", email = "research@example.com"},
]
readme = "README_script.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
]

[project.scripts]
analyze-systems = "analyze_systems:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["unit_tests"]
python_files = ["test_*.py"]
